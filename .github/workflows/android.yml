name: Android APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - run: npm ci
      - run: npm run build:mobile
      - name: Initialize and build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npm run tauri --workspace mobile -- android init
          npm run tauri --workspace mobile -- android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
