name: Android APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Setup Android SDK + NDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - run: npm ci
      - run: npm run build:mobile
      - name: Initialize and build APK
        shell: bash
        run: |
          set +e
          npm run tauri --workspace mobile -- android init > android-init.log 2>&1
          npm run tauri --workspace mobile -- android build --apk > android-build.log 2>&1
          code=$?
          tail -n 40 android-init.log; tail -n 60 android-build.log
          if [ $code -ne 0 ]; then sed 's/\x1b\[[0-9;]*m//g' android-build.log | tail -n 40 | while IFS= read -r line; do echo "::error::DIAG $line"; done; exit $code; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
