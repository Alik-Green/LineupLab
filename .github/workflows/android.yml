name: Android APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - run: npm ci
      - run: npm run build:mobile
      - name: Initialize and build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        shell: bash
        run: |
          set +e
          npm run tauri --workspace mobile -- android init > android-init.log 2>&1
          npm run tauri --workspace mobile -- android build --apk > android-build.log 2>&1
          code=$?
          tail -n 40 android-init.log; tail -n 60 android-build.log
          if [ $code -ne 0 ]; then sed 's/\x1b\[[0-9;]*m//g' android-build.log | tail -n 40 | while IFS= read -r line; do echo "::error::DIAG $line"; done; exit $code; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
