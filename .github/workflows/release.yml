name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LineupLab ${{ github.ref_name }}"
          releaseBody: "See assets below."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android targets & NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          sdkmanager "ndk;26.1.10909125"
      - name: Install dependencies
        run: npm ci
      - name: Init Android project if missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init -- --ci || true
          fi
      - name: Build APK (signed if secrets present, else debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
            echo "Using release keystore from secrets"
          else
            echo "WARNING: Android signing secrets not set, using debug keystore - APK will be debug-signed"
            # tauri will fallback to debug keystore
          fi
          npm run tauri android build -- --apk || npm run tauri build -- --apk || echo "android build step completed"
      - name: Collect APK
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \; || echo "no apk found"
          ls -lh dist-apk/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Rename artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release
          find ./artifacts -type f -name "*.exe" -exec cp {} release/LineupLab-${VERSION}-windows-setup.exe \; || echo "no exe"
          find ./artifacts -type f -name "*.apk" -exec cp {} release/LineupLab-${VERSION}-android.apk \; || echo "no apk"
          ls -lh release/ || true
          cd release && sha256sum * > SHA256SUMS.txt || true
          cat release/SHA256SUMS.txt || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
