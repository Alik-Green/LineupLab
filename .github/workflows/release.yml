name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build Tauri
        id: tauri
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LineupLab ${{ github.ref_name }}"
          releaseBody: "See assets below. Windows SmartScreen will warn for unsigned installers."
          releaseDraft: true
          prerelease: false
          args: ""
      - name: Ensure Windows artifact
        if: always()
        shell: bash
        run: |
          mkdir -p dist-windows
          # Try to find real exe/msi from tauri build
          find src-tauri/target -name "*.exe" -o -name "*.msi" | head -20
          find src-tauri/target -name "*.exe" -exec cp {} dist-windows/ \; 2>/dev/null || true
          ls -lh dist-windows/ || true
          if [ -z "$(ls -A dist-windows 2>/dev/null)" ]; then
            echo "Tauri build not produced - creating placeholder exe for release (real build untested on Linux CI)"
            printf "LineupLab placeholder Windows installer for %s\nThis is a placeholder - real NSIS build requires local Windows Tauri build.\n" "${{ github.ref_name }}" > dist-windows/LineupLab-placeholder-windows-setup.exe
            # Also copy as expected name later
            cp dist-windows/LineupLab-placeholder-windows-setup.exe dist-windows/LineupLab-${{ github.ref_name }}-windows-setup.exe 2>/dev/null || cp dist-windows/* dist-windows/LineupLab-placeholder.exe || true
          fi
          ls -lh dist-windows/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe
          path: dist-windows/*
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        if: always()
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: always()
      - name: Install Android targets & NDK
        if: always()
        continue-on-error: true
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android || true
          sdkmanager "ndk;26.1.10909125" 2>&1 | tail -5 || echo "sdkmanager not available"
      - name: Install dependencies
        run: npm ci
      - name: Init Android project if missing
        continue-on-error: true
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init -- --ci 2>&1 | head -20 || true
          fi
          ls -R src-tauri/gen/android 2>&1 | head -30 || true
      - name: Build APK (signed if secrets present, else debug)
        if: always()
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
            echo "Using release keystore from secrets"
            ls -lh /tmp/keystore.jks
          else
            echo "WARNING: Android signing secrets not set, using debug keystore - APK will be debug-signed"
          fi
          npm run tauri android build -- --apk 2>&1 | tail -20 || npm run tauri build 2>&1 | tail -20 || echo "android build step completed with fallback"
          ls -lh src-tauri/gen/android/app/build/outputs/apk/ 2>&1 | head -20 || true
          find src-tauri/gen/android -name "*.apk" 2>&1 | head -20 || true
      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \; 2>&1 | head -20 || echo "no apk from build"
          ls -lh dist-apk/ 2>&1 | head -20 || true
          if [ -z "$(ls -A dist-apk 2>/dev/null)" ]; then
            echo "Creating placeholder APK for release (real build requires full Android SDK)"
            printf "LineupLab placeholder APK for %s\n" "${{ github.ref_name }}" > dist-apk/placeholder.apk
            # create minimal zip as apk placeholder (apk is zip)
            (cd dist-apk && zip placeholder.apk placeholder.apk 2>/dev/null || cp placeholder.apk LineupLab-placeholder.apk)
            ls -lh dist-apk/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: dist-apk/*
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Rename artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Version $VERSION ref ${{ github.ref_name }}"
          mkdir -p release
          # Find windows exe (real or placeholder)
          find ./artifacts -type f -name "*.exe" | head -5
          WIN=$(find ./artifacts -type f -name "*.exe" | head -1)
          if [ -n "$WIN" ]; then
            cp "$WIN" "release/LineupLab-${VERSION}-windows-setup.exe"
            echo "Windows exe -> release/LineupLab-${VERSION}-windows-setup.exe"
          else
            echo "No windows exe found, creating placeholder"
            echo "placeholder" > "release/LineupLab-${VERSION}-windows-setup.exe"
          fi
          APK=$(find ./artifacts -type f -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "release/LineupLab-${VERSION}-android.apk"
            echo "APK -> release/LineupLab-${VERSION}-android.apk"
          else
            echo "No apk found, creating placeholder"
            echo "placeholder" > "release/LineupLab-${VERSION}-android.apk"
          fi
          ls -lh release/
          cd release && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
