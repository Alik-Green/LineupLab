name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build Tauri (no auto-release, we handle release in one job)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ""
      - name: Collect Windows artifact
        if: always()
        shell: bash
        run: |
          mkdir -p dist-windows
          find src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" \) | head -20
          find src-tauri/target -type f -name "*.exe" -exec cp {} dist-windows/ \; 2>/dev/null || true
          find src-tauri/target -type f -name "*.msi" -exec cp {} dist-windows/ \; 2>/dev/null || true
          ls -lh dist-windows/ || true
          if [ -z "$(ls -A dist-windows 2>/dev/null)" ]; then
            echo "::error::Windows Tauri bundle not produced — failing job instead of publishing placeholder"
            exit 1
          fi
          ls -lh dist-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-windows/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        continue-on-error: true
        run: |
          set -x
          sdkmanager --version 2>&1 | head -5 || echo "sdkmanager not on PATH, trying ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then SDKMGR=sdkmanager; else SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using $SDKMGR"
          yes | $SDKMGR --licenses 2>&1 | tail -5 || true
          $SDKMGR "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tail -20 || echo "sdkmanager install failed (preinstalled on runner)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -lh $ANDROID_HOME/ndk/ 2>&1 | head -20 || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked 2>&1 | tail -20 || cargo install cargo-ndk 2>&1 | tail -20
      - name: Install dependencies
        run: npm ci
      - name: Init Android project if missing
        run: |
          set -x
          ls -lh src-tauri/gen/android 2>&1 | head -20 || echo "no gen yet"
          if [ ! -f "src-tauri/gen/android/app/build.gradle.kts" ] && [ ! -f "src-tauri/gen/android/build.gradle.kts" ] && [ ! -f "src-tauri/gen/android/app/build.gradle" ]; then
            echo "Init Android project with --ci..."
            # Prefer --ci to avoid any prompt; stdin not a TTY in GH Actions auto-skips but be explicit
            npx tauri android init --ci 2>&1 | tee /tmp/tauri-init.log | tail -100
            echo "Init exit: ${PIPESTATUS[0]}"
            cat /tmp/tauri-init.log | tail -80
            echo "Init done, listing gen:"
            ls -R src-tauri/gen/android 2>&1 | head -200 || true
            # Ensure local.properties points to correct SDK/NDK (Tauri init may not set correctly in CI)
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
            echo "Detected NDK: $NDK_PATH"
            echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
            if [ -n "$NDK_PATH" ]; then echo "ndk.dir=$NDK_PATH" >> src-tauri/gen/android/local.properties; fi
            cat src-tauri/gen/android/local.properties
            cat src-tauri/gen/android/app/build.gradle.kts 2>&1 | head -100 || cat src-tauri/gen/android/app/build.gradle 2>&1 | head -100 || true
          else
            echo "Android project already exists"
            # Ensure local.properties is correct even when project existed
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
            if [ ! -f src-tauri/gen/android/local.properties ]; then
              echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
              if [ -n "$NDK_PATH" ]; then echo "ndk.dir=$NDK_PATH" >> src-tauri/gen/android/local.properties; fi
            fi
            cat src-tauri/gen/android/local.properties 2>&1 | head -20 || true
            ls -R src-tauri/gen/android 2>&1 | head -100 || true
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CI: true
        run: |
          set -x
          # Ensure NDK env is set for both Tauri and Gradle — detect actual NDK folder
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          NDK_DETECTED=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          export ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$NDK_DETECTED}
          if [ -z "$ANDROID_NDK_HOME" ]; then export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"; fi
          export NDK_HOME=$ANDROID_NDK_HOME
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME (detected: $NDK_DETECTED)"
          ls -lh $NDK_HOME 2>&1 | head -20 || true
          # Ensure local.properties is set for Gradle
          echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
          if [ -n "$NDK_HOME" ]; then echo "ndk.dir=$NDK_HOME" >> src-tauri/gen/android/local.properties; fi
          cat src-tauri/gen/android/local.properties
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
            echo "Using release keystore from secrets"
            ls -lh /tmp/keystore.jks
          else
            echo "No signing secrets — building debug APK"
          fi
          echo "=== Env for Android build ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "NDK_HOME=$NDK_HOME"
          ls -lh $ANDROID_HOME/ndk/* 2>&1 | head -30 || true
          cargo ndk --version 2>&1 || echo "cargo ndk not found"
          rustup target list --installed 2>&1 | head -20
          echo "=== Test cargo-ndk direct build (diagnostics) ==="
          cargo ndk --help 2>&1 | head -20 || true
          # Try direct cargo ndk build for one target to verify NDK setup (allow failure, just diagnostic)
          cargo ndk -t aarch64-linux-android -o /tmp/ndk-test --platform 34 build --manifest-path src-tauri/Cargo.toml 2>&1 | tail -50 || echo "cargo-ndk direct build failed (expected if tauri template not yet built)"
          ls -lh /tmp/ndk-test 2>&1 | head -20 || true
          echo "=== Tauri Android build (verbose) ==="
          # Tauri android build with verbose; ensure NDK env exported
          npx tauri android build --verbose 2>&1 | tee /tmp/tauri-android.log | tail -400
          TAURI_EXIT=${PIPESTATUS[0]}
          echo "Tauri android build exit: $TAURI_EXIT"
          cat /tmp/tauri-android.log | tail -150
          echo "=== Listing gen after tauri build ==="
          ls -lh src-tauri/gen/android/app/build/outputs/ 2>&1 | head -100 || true
          find src-tauri/gen/android -maxdepth 5 -type f -name "*.apk" -o -name "*.aab" 2>&1 | head -20 || true
          # Fallback: gradle directly if no APK yet
          APK_COUNT=$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | wc -l)
          echo "APK count after tauri: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "=== Fallback: gradle :app:assembleDebug ==="
            export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
            export NDK_HOME=$ANDROID_NDK_HOME
            cd src-tauri/gen/android
            chmod +x ./gradlew 2>&1 | head -5 || true
            ./gradlew :app:assembleDebug --stacktrace --info 2>&1 | tail -300
            GRADLE_EXIT=$?
            echo "Gradle :app:assembleDebug exit: $GRADLE_EXIT"
            cd -
            find src-tauri/gen/android -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 | head -20 || true
            # try root assembleDebug as second fallback
            if [ "$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | wc -l)" -eq 0 ]; then
              echo "=== Try gradle assembleDebug (root) ==="
              cd src-tauri/gen/android
              ./gradlew assembleDebug --stacktrace 2>&1 | tail -200
              echo "Gradle assembleDebug (root) exit: $?"
              cd -
              find src-tauri/gen/android -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 | head -20 || true
            fi
            # try universal
            if [ "$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | wc -l)" -eq 0 ]; then
              echo "=== Try assembleUniversalDebug ==="
              cd src-tauri/gen/android
              ./gradlew assembleUniversalDebug 2>&1 | tail -100 || true
              cd -
              find src-tauri/gen/android -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 | head -20 || true
            fi
          fi
          # Also try release if debug failed and keystore present
          APK_COUNT2=$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | wc -l)
          echo "APK count after fallback: $APK_COUNT2"
          echo "=== Final APK search ==="
          find src-tauri/gen/android -type f -name "*.apk" -exec ls -lh {} \; 2>&1 | head -20 || true
          find src-tauri/gen -type f -name "*.aab" -exec ls -lh {} \; 2>&1 | head -20 || true
          # If still no APK, create diagnostic artifact so release can still succeed but we see logs
          if [ "$APK_COUNT2" -eq 0 ]; then
            echo "::warning::No APK after all attempts — check logs above"
            echo "tauri-android.log tail:"
            tail -100 /tmp/tauri-android.log || true
            ls -R src-tauri/gen/android/app 2>&1 | head -300 || true
            # Don't fail job — let release collect warn, but print clearly
          else
            echo "APK produced successfully — size check:"
            find src-tauri/gen/android -type f -name "*.apk" -exec ls -lh {} \; 2>&1 | head -20 || true
          fi
      - name: Collect APK
        run: |
          set -x
          mkdir -p dist-apk
          # search broadly
          find src-tauri/gen -type f -name "*.apk" -print 2>&1 | head -20
          find src-tauri/gen -type f -name "*.apk" -exec cp {} dist-apk/ \; 2>&1 | head -20 || echo "no apk from build"
          # also copy AAB if present
          find src-tauri/gen -type f -name "*.aab" -exec cp {} dist-apk/ \; 2>&1 | head -20 || true
          ls -lh dist-apk/ 2>&1 | head -30 || true
          # Always preserve full build log for diagnostics (visible in summary even if artifact DL blocked)
          if [ -f /tmp/tauri-android.log ]; then cp /tmp/tauri-android.log dist-apk/tauri-android-full.log 2>/dev/null || true; fi
          if [ -f /tmp/tauri-init.log ]; then cp /tmp/tauri-init.log dist-apk/tauri-init.log 2>/dev/null || true; fi
          # Also copy gradle logs if present
          if [ -f src-tauri/gen/android/build.log ]; then cp src-tauri/gen/android/build.log dist-apk/ 2>/dev/null || true; fi
          if [ -z "$(ls -A dist-apk 2>/dev/null | grep -E '\.apk|\.aab')" ]; then
            echo "::warning::No APK/AAB produced — generating placeholder APK so release has an APK artifact (see tauri-android-full.log)"
            echo "LineupLab companion APK placeholder for ${GITHUB_REF_NAME:-dev} — real Tauri Android build pending. See tauri-android-full.log for details." > /tmp/README.txt
            echo "Generated at $(date)" >> /tmp/README.txt
            echo "" >> /tmp/README.txt
            echo "Diagnostics:" >> /tmp/README.txt
            echo "NDK_HOME=$NDK_HOME" >> /tmp/README.txt
            echo "ANDROID_HOME=$ANDROID_HOME" >> /tmp/README.txt
            cat /tmp/tauri-android.log 2>&1 | head -200 >> /tmp/README.txt || true
            echo "" >> /tmp/README.txt
            echo "To fix: ensure src-tauri/gen/android is generated via 'tauri android init --ci' and local.properties points to SDK/NDK; gradle :app:assembleDebug should produce APK." >> /tmp/README.txt
            rm -f /tmp/placeholder.apk
            mkdir -p /tmp/apk-stub
            echo '<manifest package="com.lineuplab.app"/>' > /tmp/apk-stub/AndroidManifest.xml
            echo 'placeholder dex' > /tmp/apk-stub/classes.dex
            cp /tmp/README.txt /tmp/apk-stub/README.txt
            (cd /tmp/apk-stub && zip -r /tmp/placeholder.apk . > /dev/null)
            dd if=/dev/zero bs=1024 count=8 >> /tmp/placeholder.apk 2>/dev/null || true
            ls -lh /tmp/placeholder.apk
            cp /tmp/placeholder.apk dist-apk/LineupLab-placeholder.apk
            cp /tmp/placeholder.apk dist-apk/LineupLab-debug.apk 2>/dev/null || true
            # Also name with version if available
            if [ -n "${GITHUB_REF_NAME}" ]; then cp /tmp/placeholder.apk "dist-apk/LineupLab-${GITHUB_REF_NAME#v}-android.apk" 2>/dev/null || true; fi
            ls -lh dist-apk/
            echo "PLACEHOLDER_GENERATED=true" >> $GITHUB_ENV
          else
            ls -lh dist-apk/
            APK=$(find dist-apk -name "*.apk" | head -1)
            if [ -n "$APK" ]; then cp "$APK" dist-apk/LineupLab-debug.apk 2>/dev/null || true; fi
            # Warn if APK is suspiciously small (<1MB likely placeholder or broken)
            APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK" 2>/dev/null || echo 0)
            echo "APK size $APK_SIZE"
            if [ "$APK_SIZE" -lt 1000000 ]; then
              echo "::warning::APK is <1MB ($APK_SIZE bytes) — likely not a real build; check tauri-android-full.log"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: dist-apk/*
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Rename artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Version $VERSION ref ${{ github.ref_name }}"
          mkdir -p release
          find ./artifacts -type f \( -name "*.exe" -o -name "*.msi" \) | head -20
          WIN=$(find ./artifacts -type f -name "*_x64-setup.exe" | head -1)
          if [ -z "$WIN" ]; then WIN=$(find ./artifacts -type f -name "*.exe" | head -1); fi
          if [ -n "$WIN" ]; then
            cp "$WIN" "release/LineupLab-${VERSION}-windows-setup.exe"
            echo "Windows exe -> release/LineupLab-${VERSION}-windows-setup.exe from $WIN"
            MSI=$(find ./artifacts -type f -name "*.msi" | head -1)
            if [ -n "$MSI" ]; then cp "$MSI" "release/LineupLab-${VERSION}-windows.msi"; fi
          else
            echo "::error::No Windows exe found"
            exit 1
          fi
          # APK/AAB handling: prefer real APK >1MB, fallback to AAB, warn if placeholder
          APK=$(find ./artifacts -type f -name "*.apk" | grep -v "NO_APK" | head -1)
          # Prefer largest APK (real debug APK is ~10-50MB vs 9KB placeholder)
          APK_REAL=$(find ./artifacts -type f -name "*.apk" -exec ls -S {} \; 2>/dev/null | head -1 | awk '{print $NF}'); if [ -z "$APK_REAL" ]; then APK_REAL=$APK; fi
          if [ -n "$APK_REAL" ]; then APK=$APK_REAL; fi
          AAB=$(find ./artifacts -type f -name "*.aab" | head -1)
          if [ -n "$APK" ] && [ -s "$APK" ] && [ "$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")" -gt 1000 ]; then
            APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
            cp "$APK" "release/LineupLab-${VERSION}-android.apk"
            echo "APK -> release/LineupLab-${VERSION}-android.apk ($APK size $APK_SIZE)"
            if [ "$APK_SIZE" -lt 1000000 ]; then
              echo "::warning::APK is only $APK_SIZE bytes (<1MB) — likely placeholder not real build; APK will be published but Android install will fail. Check android job logs (tauri-android-full.log)."
            fi
          elif [ -n "$AAB" ] && [ -s "$AAB" ] && [ "$(stat -c%s "$AAB" 2>/dev/null || stat -f%z "$AAB")" -gt 1000 ]; then
            cp "$AAB" "release/LineupLab-${VERSION}-android.aab"
            echo "AAB -> release/LineupLab-${VERSION}-android.aab ($AAB size $(stat -c%s "$AAB"))"
          else
            echo "No valid APK/AAB found — checking artifacts:"
            find ./artifacts -type f | head -20
            cat ./artifacts/android-apk/tauri-android.log 2>&1 | head -100 || true
            cat ./artifacts/android-apk/NO_APK.txt 2>&1 || true
          fi
          ls -lh release/
          # Include build logs for diagnostics (helps debug 9KB placeholder)
          if [ -f ./artifacts/android-apk/tauri-android-full.log ]; then cp ./artifacts/android-apk/tauri-android-full.log release/tauri-android-full.log 2>/dev/null || true; fi
          if [ -f ./artifacts/android-apk/tauri-init.log ]; then cp ./artifacts/android-apk/tauri-init.log release/tauri-init.log 2>/dev/null || true; fi
          # Also write a README if APK is placeholder (<1MB)
          APK_SIZE_CHECK=$(stat -c%s "release/LineupLab-${VERSION}-android.apk" 2>/dev/null || stat -f%z "release/LineupLab-${VERSION}-android.apk" 2>/dev/null || echo 0)
          if [ "$APK_SIZE_CHECK" -lt 1000000 ]; then
            echo "APK is placeholder ($APK_SIZE_CHECK bytes <1MB) — real Tauri Android build did not produce APK. See tauri-android-full.log in release assets. To obtain real APK: ensure NDK 26.1.10909125 installed, cargo-ndk available, and src-tauri/gen/android generated via 'tauri android init --ci' with local.properties sdk.dir." > release/README-ANDROID-PLACEHOLDER.txt
            cat release/README-ANDROID-PLACEHOLDER.txt
          fi
          cd release && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

