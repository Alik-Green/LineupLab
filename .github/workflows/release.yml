name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build Tauri (no auto-release, we handle release in one job)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ""
      - name: Collect Windows artifact
        if: always()
        shell: bash
        run: |
          mkdir -p dist-windows
          # Tauri bundles go to src-tauri/target/release/bundle/nsis/*.exe and msi/*.msi
          find src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" \) | head -20
          find src-tauri/target -type f -name "*.exe" -exec cp {} dist-windows/ \; 2>/dev/null || true
          find src-tauri/target -type f -name "*.msi" -exec cp {} dist-windows/ \; 2>/dev/null || true
          ls -lh dist-windows/ || true
          if [ -z "$(ls -A dist-windows 2>/dev/null)" ]; then
            echo "::error::Windows Tauri bundle not produced — failing job instead of publishing placeholder"
            exit 1
          fi
          ls -lh dist-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-windows/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages (runner already has SDK)
        continue-on-error: true
        run: |
          sdkmanager --version 2>&1 | head -5 || echo "sdkmanager not on PATH, trying ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then SDKMGR=sdkmanager; else SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using $SDKMGR"
          yes | $SDKMGR --licenses 2>&1 | tail -5 || true
          $SDKMGR "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tail -20 || echo "sdkmanager install failed (preinstalled on runner)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install dependencies
        run: npm ci
      - name: Init Android project if missing
        continue-on-error: true
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init -- --ci 2>&1 | head -20 || true
          fi
          ls -R src-tauri/gen/android 2>&1 | head -30 || true
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
            echo "Using release keystore from secrets"
          else
            echo "No signing secrets — building debug APK"
          fi
          npm run tauri android build -- --apk 2>&1 | tail -100
          ls -lh src-tauri/gen/android/app/build/outputs/apk/ 2>&1 | head -30 || true
          find src-tauri/gen/android -name "*.apk" 2>&1 | head -20 || true
      - name: Collect APK
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \; 2>&1 | head -20 || echo "no apk from build"
          ls -lh dist-apk/ 2>&1 | head -20 || true
          if [ -z "$(ls -A dist-apk 2>/dev/null)" ]; then
            echo "::warning::No APK produced — Android build failed, will skip Android asset in release (no placeholder)"
            exit 0
          fi
          ls -lh dist-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: dist-apk/*
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Rename artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Version $VERSION ref ${{ github.ref_name }}"
          mkdir -p release
          # Deduplicate Windows exe: Tauri produces LineupLab_0.2.5_x64-setup.exe style, we normalize to LineupLab-VERSION-windows-setup.exe as single file
          find ./artifacts -type f \( -name "*.exe" -o -name "*.msi" \) | head -20
          # Prefer _x64-setup.exe from bundle (real NSIS) over any other
          WIN=$(find ./artifacts -type f -name "*_x64-setup.exe" | head -1)
          if [ -z "$WIN" ]; then WIN=$(find ./artifacts -type f -name "*.exe" | head -1); fi
          if [ -n "$WIN" ]; then
            cp "$WIN" "release/LineupLab-${VERSION}-windows-setup.exe"
            echo "Windows exe -> release/LineupLab-${VERSION}-windows-setup.exe from $WIN"
            # also include MSI if present as separate asset (optional)
            MSI=$(find ./artifacts -type f -name "*.msi" | head -1)
            if [ -n "$MSI" ]; then cp "$MSI" "release/LineupLab-${VERSION}-windows.msi"; fi
          else
            echo "::error::No Windows exe found"
            exit 1
          fi
          # APK is optional — only include if built, do NOT create placeholder
          APK=$(find ./artifacts -type f -name "*.apk" | head -1)
          if [ -n "$APK" ] && [ -s "$APK" ] && [ "$(stat -c%s "$APK")" -gt 1000 ]; then
            cp "$APK" "release/LineupLab-${VERSION}-android.apk"
            echo "APK -> release/LineupLab-${VERSION}-android.apk ($APK size $(stat -c%s "$APK"))"
          else
            echo "No valid APK found (size too small or missing) — skipping Android asset, see android job logs"
          fi
          ls -lh release/
          cd release && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
