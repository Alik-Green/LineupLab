name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  core-ui-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Rust core tests (including doctests)
        run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            desktop/dist
            mobile/dist
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Windows installer
        run: npm run tauri --workspace desktop -- build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
  desktop-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - name: Check desktop shell compiles on Linux (mocked platform paths)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
