name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  core-ui-ubuntu:
    if: ${{ !contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Rust core tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --lib --bins --tests > core-test.log 2>&1
          code=$?
          tail -n 40 core-test.log
          if [ $code -ne 0 ]; then tail -n 40 core-test.log | while IFS= read -r line; do echo "::error::$line"; done; exit $code; fi
      - name: Rust doctests
        shell: bash
        run: |
          set +e
          cargo test --workspace --doc > doc-test.log 2>&1
          code=$?
          tail -n 30 doc-test.log
          if [ $code -ne 0 ]; then tail -n 30 doc-test.log | while IFS= read -r line; do echo "::error::$line"; done; exit $code; fi
      - run: cargo fmt --all -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: 'desktop/dist' }
  desktop-windows:
    if: ${{ !contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Check desktop shell (Windows)
        run: |
          set +e
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --message-format=short > windows-check.log 2>&1
          code=$?
          tail -n 20 windows-check.log
          if [ $code -ne 0 ]; then grep -E '(^error|error\[|error:)' windows-check.log | head -40 | while IFS= read -r line; do echo "::error::DIAG $line"; done; exit $code; fi
      - name: Build Tauri Windows installer
        run: |
          set +e
          npm run tauri --workspace desktop -- build > windows-build.log 2>&1
          code=$?
          tail -n 60 windows-build.log
          if [ $code -ne 0 ]; then grep -E '(^error|error\[|error:|failed)' windows-build.log | head -40 | while IFS= read -r line; do echo "::error::DIAG $line"; done; exit $code; fi
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: 'desktop/src-tauri/target/release/bundle/nsis/*.exe' }
  desktop-ubuntu:
    if: ${{ !contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - name: Check desktop shell compiles on Linux
        run: |
          set +e
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --message-format=short > desktop-check.log 2>&1
          code=$?
          tail -n 60 desktop-check.log
          if [ $code -ne 0 ]; then grep -E '(^error|error\[|error:)' desktop-check.log | head -40 | while IFS= read -r line; do echo "::error::DIAG $line"; done; exit $code; fi

  # A push marker lets the established CI workflow invoke release packaging from
  # this session branch without merging into main or pushing another branch.
  publish-release-assets:
    if: ${{ contains(github.event.head_commit.message, '[publish release]') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: v0.1.0-preview.1
      windows_run_id: '42386769967'
      android_run_id: '42388911819'
