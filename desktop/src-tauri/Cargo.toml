[package]
name = "lineuplab-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LineupLab Windows desktop shell (Tauri 2)"
default-run = "lineuplab-desktop"

[lib]
name = "lineuplab_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lineuplab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lineuplab-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
