[package]
name = "lineuplab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable, game-independent storage, packs, catalog and sync for LineupLab"
default-run = "lineuplab-pack"

[lib]
name = "lineuplab_core"
path = "src/lib.rs"

[[bin]]
name = "lineuplab-pack"
path = "src/bin/pack.rs"

[[bin]]
name = "lineuplab-server"
path = "src/bin/server.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
zip = { version = "0.6.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
mdns-sd = "0.13"
rand = "0.8"
subtle = "2"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
